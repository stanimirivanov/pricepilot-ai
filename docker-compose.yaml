version: "3.8"

services:
  api:
    build: .
    container_name: pricepilot-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=docker
      - DATA_RAW_DIR=/app/data/raw
      - DATA_PROCESSED_DIR=/app/data/processed
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow/mlflow.db
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow:/app/mlflow
      - ./logs:/app/logs
    entrypoint: ["/app/scripts/docker-entrypoint.sh"]
    command:
      [
        "uvicorn",
        "pricepilot.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - pricepilot-network
    restart: unless-stopped

  mlflow:
    build: .
    container_name: pricepilot-mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow/mlflow.db
    volumes:
      - ./mlflow:/app/mlflow
    command:
      [
        "mlflow",
        "ui",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--backend-store-uri",
        "sqlite:////app/mlflow/mlflow.db",
      ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - pricepilot-network
    restart: unless-stopped

  pipeline:
    build: .
    container_name: pricepilot-pipeline
    environment:
      - ENVIRONMENT=docker
      - MLFLOW_TRACKING_URI=sqlite:////app/mlflow/mlflow.db
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlflow:/app/mlflow
      - ./logs:/app/logs
    entrypoint: ["/app/scripts/docker-entrypoint.sh"]
    command: ["python", "scripts/run_governance.py", "--threshold", "balanced"]
    networks:
      - pricepilot-network
    depends_on:
      - mlflow
    restart: "no" # Run once and exit

networks:
  pricepilot-network:
    driver: bridge

volumes:
  data:
  models:
  mlflow:
  logs:
