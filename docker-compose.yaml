version: "3.8"

services:
  pricepilot:
    build: .
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
    environment:
      - ENVIRONMENT=docker
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
    ports:
      - "8000:8000"
    command: tail -f /dev/null # Keep container running for development

  mlflow:
    build: .
    command: mlflow ui --host 0.0.0.0 --port 5000
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
      - ./mlflow.db:/app/mlflow.db
