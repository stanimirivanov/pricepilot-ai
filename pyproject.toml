[project]
name = "pricepilot-ai"
version = "0.1.0"
description = "AI-Native Dynamic Pricing"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Stanimir Ivanov", email = "stanimr@protonmail.com" }
]
keywords = ["dynamic-pricing", "machine-learning", "revenue-management", "bayesian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "bentoml>=1.4.39",
    "click>=8.4.2",
    "cvxpy>=1.9.2",
    "fastapi>=0.141.1",
    "jupyter>=1.1.1",
    "langchain>=1.3.15",
    "langchain-openai>=1.5.1",
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "mapie>=1.5.0",
    "matplotlib>=3.11.1",
    "mlflow>=1.27.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymc>=5.28.5",
    "pyod>=3.6.5",
    "pytensor>=2.38.3",
    "python-dotenv>=1.2.3",
    "pytorch-forecasting>=1.8.0",
    "pytorch-lightning>=2.6.5",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "statsforecast>=2.0.1",
    "tqdm>=4.70.0",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
pricepilot-ai = "pricepilot_ai:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepilot"]



[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "isort>=8.0.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
