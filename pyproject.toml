[project]
name = "pricepilot-ai"
version = "0.1.0"
description = "AI-Native Dynamic Pricing"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.2",
    "cvxpy>=1.9.2",
    "fastapi>=0.141.1",
    "jupyter>=1.1.1",
    "langchain>=1.3.15",
    "langgraph>=1.2.11",
    "loguru>=0.7.3",
    "mapie>=1.5.0",
    "matplotlib>=3.11.1",
    "mlflow>=1.27.0",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pymc>=5.28.5",
    "pyod>=3.6.5",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "statsforecast>=2.0.1",
    "tqdm>=4.70.0",
    "typer>=0.27.1",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pricepilot = "pricepilot.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pricepilot"]

[tool.hatch.build.targets.wheel.force-include]
"src/pricepilot/py.typed" = "pricepilot/py.typed"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers --strict-config"

[tool.coverage.run]
source = ["src/pricepilot"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true